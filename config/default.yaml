# Moeen configuration - the single place for tunable settings.
# Command-line flags (e.g. --camera-index) override values here for one run.
# Units are explicit in every key name or comment: *_seconds = seconds, *_deg = degrees,
# "torso lengths" = the person's shoulder-hip distance (a camera-distance-free body unit).

camera:
  index: 0                    # 0 = built-in webcam on most laptops; try 1 if it opens the wrong camera
  width: 640                  # requested capture size; the driver may choose the nearest supported size
  height: 480
  fps: 30                     # requested capture rate (a request, not a guarantee)
  backend: auto               # auto | any | dshow | msmf | avfoundation | v4l2
  open_timeout_seconds: 5.0   # how long to wait for the first frame after opening
  read_failure_limit: 30      # consecutive failed reads before the camera is considered lost

pose:
  model_variant: full         # lite (fastest) | full (balanced) | heavy (most accurate, slowest)
  model_dir: models           # relative to the project root
  num_poses: 1                # single-person MVP
  min_pose_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
  min_tracking_confidence: 0.5

# Feature extraction (Phase 2). These values only shape the *features* (measurements and
# posture labels). They never raise alerts; alert logic arrives in Phase 3.
# Units: "frame heights" = fraction of image height; "torso lengths" = distance between the
# shoulder center and hip center of the person, i.e. a body-size unit that does not change
# when the person walks closer to or farther from the camera.
features:
  history_seconds: 10.0                 # how much feature history is kept for later phases
  min_visibility: 0.5                   # landmarks below this visibility are ignored
  min_presence: 0.5                     # landmarks below this in-frame presence are ignored
  velocity_window_seconds: 0.3          # vertical velocity = slope of position over this window
  max_gap_seconds: 0.5                  # a pose gap longer than this restarts velocity/motion tracking
  motion_window_seconds: 1.0            # motion magnitude = RMS keypoint displacement within this window
  motion_min_coverage: 0.5              # fraction of the motion window that must contain pose data
  default_torso_length: 0.25            # frame heights; body-scale fallback before a reference exists
  torso_reference_tau_seconds: 2.0      # smoothing of the body-scale reference (upright frames only)
  standing_rise_tau_seconds: 0.5        # standing-height reference follows the person UP quickly...
  standing_fall_tau_seconds: 30.0       # ...and DOWN only slowly...
  normal_hip_drop: 0.6                  # ...and only while the hip drop is below this (e.g. walking toward
                                        # the camera). Deeper drops (sitting ~0.9, lying ~1.6) never move
                                        # the reference. drop_score also starts rising above this value.
  upright_max_angle_deg: 30.0           # torso within this angle of vertical counts as upright
  # horizontal_min_angle_deg: set in config/calibration.yaml as 'torso_horizontal_deg'
  horizontal_min_aspect: 1.3            # body bounding box wider than tall (w/h) supports "horizontal"
  # low_hip_drop: set in config/calibration.yaml as 'low_posture_hip_drop'
  lying_min_hip_drop: 0.6               # a horizontal torso only counts as lying if hips dropped this much

# Fall state machine (Phase 3): NORMAL -> POSSIBLE_FALL -> RECOVERY_WINDOW -> ALERT -> RESOLVED.
# The main thresholds are in config/calibration.yaml (plain names, tuned for the camera
# setup; check them with python scripts/calibrate.py). The score is a rule-based system
# score in [0, 1], NOT a medical probability.
fall_detection:
  # -- candidate (NORMAL -> POSSIBLE_FALL): fast downward motion + a posture change
  candidate_window_seconds: 0.6         # evidence window looked at on every frame
  baseline_window_seconds: 1.0          # extra history before it, to measure the torso-angle rise from
  # fall_velocity_threshold: set in config/calibration.yaml as 'fall_velocity_threshold'
  velocity_min_seconds: 0.1             # velocity must exceed the threshold for this long (not one frame)
  # torso_angle_change_deg: set in config/calibration.yaml as 'torso_angle_change_deg'
  candidate_low_posture_score: 0.5      # low_posture_score that counts as moving toward low/horizontal
  # -- confirmation (POSSIBLE_FALL -> RECOVERY_WINDOW): all three kinds of evidence
  confirm_window_seconds: 2.0           # time allowed, from candidate start, to collect all evidence
  confirm_posture_seconds: 0.3          # low/horizontal posture must be held continuously this long
  # -- recovery / escalation
  # recovery_window_seconds: set in config/calibration.yaml as 'recovery_window_seconds'
  recovery_hold_seconds: 1.5            # UPRIGHT posture held this long = recovered (incident cancelled)
  # escalation_lookback_seconds: set in config/calibration.yaml as 'decision_history_seconds'
  abnormal_posture_fraction: 0.7        # share of lookback frames that are low/horizontal to escalate
  # low_motion_threshold: set in config/calibration.yaml as 'fall_still_motion_threshold'
  max_extension_seconds: 20.0           # if still down but moving, escalate anyway this long after the window
  # alert_score_threshold: set in config/calibration.yaml as 'alert_score_threshold'
  # -- alert / resolved
  alert_clear_hold_seconds: 3.0         # UPRIGHT held this long while in ALERT = resolved by recovery
  resolved_hold_seconds: 3.0            # RESOLVED is shown this long before returning to NORMAL
  pose_loss_counts_as_abnormal: true    # after a fall, "person not visible" counts as not recovered
  # -- score weights (relative; normalized by their sum)
  weight_velocity: 0.25
  weight_angle: 0.15
  weight_posture: 0.25
  weight_stillness: 0.15
  weight_persistence: 0.20

# Sustained lying/low posture and immobility (Phase 4). Same state machine as falls:
# NORMAL -> MONITORING -> ALERT -> RESOLVED. Sitting on a chair or bending never counts as
# lying; upright stillness is only ever MONITORING (never an alert). "Not moving" means the
# motion magnitude (RMS keypoint displacement over 1 s, torso lengths) is at or below
# still_motion_threshold.
immobility:
  lying_monitor_seconds: 5.0            # low/horizontal posture sustained this long -> MONITORING (LOW risk)
  posture_tolerance_seconds: 1.0        # posture blips shorter than this do not reset sustained timers
  # still_motion_threshold: set in config/calibration.yaml as 'immobility_motion_threshold'
  still_tolerance_seconds: 0.5          # motion blips shorter than this do not reset the stillness timer
  # horizontal_still_alert_seconds: set in config/calibration.yaml as 'immobility_alert_seconds'
  low_still_alert_seconds: 120.0        # low posture (e.g. slumped on the floor) AND not moving -> ALERT
  horizontal_alert_seconds: 300.0       # lying this long even while moving -> ALERT (0 = disabled)
  upright_still_monitor_seconds: 300.0  # upright and not moving this long -> MONITORING only (0 = disabled)
  monitor_clear_seconds: 5.0            # non-low posture held this long ends a lying MONITORING
  recent_candidate_seconds: 60.0        # a fall candidate within this time makes immobility stronger evidence:
  recent_candidate_factor: 0.5          #   alert durations are multiplied by this, and the alert is HIGH
                                        #   instead of MEDIUM
  rearm_requires_upright: true          # after a resolved alert, lying/immobility checks wait until the
                                        # person has been seen upright (no repeat alerts while being helped)

# Event history (Phase 5). The database file is created automatically on first run.
database:
  enabled: true                         # false (or --no-db) runs without storing events
  path: data/moeen.db                   # relative to the project root

# Local dashboard (Phase 6): http://127.0.0.1:5000 while python -m moeen.app runs.
dashboard:
  enabled: true                         # false (or --no-dashboard) runs without the web server
  host: 127.0.0.1                       # local only; use 0.0.0.0 only on a trusted network
  port: 5000
  status_poll_ms: 1000                  # how often the browser asks for the current state
  events_poll_ms: 3000                  # how often the browser refreshes the event history
  stale_after_seconds: 3.0              # no update from the camera loop for this long = "not updating"
  command_timeout_seconds: 2.0          # how long a button waits for the camera loop to apply it
  preview_enabled: true                 # show the processed camera frames on the dashboard
  preview_fps: 8                        # preview frames per second (keeps CPU low)
  preview_jpeg_quality: 70

sound:
  enabled: true                         # false (or --no-sound) keeps alerts silent; 'm' mutes live
  min_severity: HIGH                    # LOW / MEDIUM / HIGH - sound only for alerts at or above this
  repeat_seconds: 30                    # repeat while the alert stays unanswered (0 = once per alert)
  max_plays_per_alert: 5                # including the first play
  cooldown_seconds: 10                  # never two sounds closer than this (debounce across incidents)
  backend: auto                         # auto / winsound / afplay / paplay / pw-play / aplay / bell / none
  tone_hz: 880                          # chime pitch
  volume: 0.6                           # 0-1, of the generated chime
  play_timeout_seconds: 6               # a player that hangs longer than this is stopped
  max_failures: 3                       # give up on a player after this many failures in a row

display:
  show_window: true
  window_name: "Moeen - live pose preview (q / Esc to quit)"
  mirror: true                # flip the *displayed* image like a selfie; pose runs on the unflipped frame
  landmark_visibility_threshold: 0.5   # landmarks below this visibility are not drawn
  fps_window_seconds: 1.0     # FPS counter averages over this window
  console_log_interval_seconds: 5.0
